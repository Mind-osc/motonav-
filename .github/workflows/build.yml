name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MOTONAV_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Κλειδί υπογραφής
        id: keys
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "MOTONAV_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json; fi
          if [ -n "$KEYSTORE_BASE64" ] || [ -f app/release.keystore ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Χωρίς κλειδί υπογραφής: τρέχουν μόνο τα tests και το build, χωρίς Release."
          fi

      - name: Tests
        run: gradle :app:testReleaseUnitTest --stacktrace --no-daemon

      - name: Build
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Rename
        if: steps.keys.outputs.signed == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk moto-nav.apk

      - name: Release
        if: steps.keys.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --pretty=%B > notes.txt
          gh release create "build-${{ github.run_number }}" moto-nav.apk \
            --title "Moto Nav 0.1.${{ github.run_number }}" \
            --notes-file notes.txt \
            --latest
