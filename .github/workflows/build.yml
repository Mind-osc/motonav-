name: Build APK

on:
  push:
    branches: [main]
    # Η web έκδοση (iPhone) δεν χτίζει νέο APK.
    paths-ignore:
      - 'web/**'
      - '.github/workflows/pages.yml'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MOTONAV_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Κλειδί υπογραφής
        id: keys
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d " \r\n" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "MOTONAV_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json; fi
          if [ -n "$KEYSTORE_BASE64" ] || [ -f app/release.keystore ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Χωρίς κλειδί υπογραφής: τρέχουν μόνο τα tests και το build, χωρίς Release."
          fi

      - name: Tests
        run: gradle :app:testReleaseUnitTest --stacktrace --no-daemon

      - name: Build
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Rename
        if: steps.keys.outputs.signed == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk moto-nav.apk

      # Μία φορά: APK με το παλιό κλειδί (μπαίνει από πάνω στην παλιά εφαρμογή, για το αντίγραφο ασφαλείας).
      - name: Build με το παλιό κλειδί
        if: steps.keys.outputs.signed == 'true' && hashFiles('app/legacy.keystore') != ''
        run: |
          MOTONAV_LEGACY=1 gradle :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk moto-nav-old-key.apk

      # Δεύτερο APK για το public repo: ίδιο κλειδί, χωρίς την Pointer (άδεια μόνο για προσωπική χρήση).
      - name: Build για το public (χωρίς Pointer)
        if: steps.keys.outputs.signed == 'true' && hashFiles('app/src/main/res/font/pointer.ttf') != ''
        run: |
          rm app/src/main/res/font/pointer.ttf
          gradle :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk moto-nav-public.apk

      - name: Release
        if: steps.keys.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --pretty=%B > notes.txt
          gh release create "build-${{ github.run_number }}" moto-nav.apk $(ls moto-nav-public.apk moto-nav-old-key.apk 2>/dev/null) \
            --title "Moto Nav 0.1.${{ github.run_number }}" \
            --notes-file notes.txt \
            --latest
