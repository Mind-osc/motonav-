name: POIs (offline κατηγορίες, από Geofabrik)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "41 2 * * 1"   # κάθε Δευτέρα
  push:
    branches: [main]
    paths: ["tools/places/build_pois_pbf.py", ".github/workflows/pois.yml"]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Εργαλεία
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          pip install -q osmium
      - name: Ελλάδα από το Geofabrik
        run: |
          curl -fsSL --retry 5 --retry-delay 20 -o /tmp/gr.pbf https://download.geofabrik.de/europe/greece-latest.osm.pbf
          ls -la /tmp/gr.pbf
          osmium tags-filter /tmp/gr.pbf \
            nw/amenity=fuel,cafe,drinking_water,car_wash,restaurant,fast_food \
            nw/shop=motorcycle,motorcycle_repair,car_repair,tyres \
            nw/tourism=hotel,guest_house,hostel,camp_site,viewpoint,alpine_hut \
            -o /tmp/pois.pbf --overwrite
      - name: Σημεία
        run: python tools/places/build_pois_pbf.py /tmp/pois.pbf
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add app/src/main/assets/places/gr-pois.tsv
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: σημεία Ελλάδας (βενζίνη, καφέ κ.ά.) για offline κατηγορίες"
          git pull --rebase origin main
          git push
          gh workflow run build.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
